[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jep-claude-replay"
version = "0.1.0"
description = "Replay Claude agent sessions with JEP-compatible accountability events, tool lineage, delegation flow, and verification state."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "jep-claude-replay maintainers"}]
dependencies = [
    "PyNaCl>=1.6.2,<2","cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jep-claude-replay = "jep_claude_replay.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
