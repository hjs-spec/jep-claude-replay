<!doctype html><html><head><meta charset="utf-8"><title>Claude Session Replay</title><style>
body{margin:0;font-family:Inter,system-ui;background:#0d1117;color:#e6edf3}.app{display:grid;grid-template-columns:240px 1fr 390px;grid-template-rows:1fr 260px;height:100vh}.panel{border:1px solid #30363d;padding:16px;overflow:auto}.left{background:#161b22}.timeline{background:#0d1117}.inspector{background:#111827}.graph{grid-column:1/4;background:#0b1220}button,.event{width:100%;text-align:left;margin:6px 0;padding:10px;border:1px solid #30363d;border-radius:8px;background:#161b22;color:#e6edf3;cursor:pointer}.event.fail,.tampered{border-color:#f85149;background:#2d1111}.event.pass{border-color:#2ea043}.hash{font-family:ui-monospace;font-size:11px;color:#8b949e;word-break:break-all}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#30363d}.passText{color:#3fb950}.failText{color:#f85149}pre{white-space:pre-wrap;font-size:12px}.edge{color:#a5d6ff}
</style></head><body><div class="app"><div class="panel left"><h2>Sessions</h2><button onclick="load('examples/archives/simple_tool_session.jsonl')">simple_tool_session</button><button onclick="load('examples/archives/code_edit_session.jsonl')">code_edit_session</button><button onclick="load('examples/archives/tampered_session.jsonl')">tampered_session</button><h3 id="integrity"></h3><p>Replay-safe JSONL archives with J/D/T/V accountability events.</p></div><div class="panel timeline"><h2>Replay Timeline</h2><div id="timeline"></div></div><div class="panel inspector"><h2>Event Inspector</h2><pre id="inspector">Click an event.</pre></div><div class="panel graph"><h2>Lineage Graph</h2><div id="graph"></div></div></div><script>
let current=[];async function load(path){let r=await fetch('/api/archive?path='+encodeURIComponent(path));let d=await r.json();current=d.events;let v=d.verification;document.getElementById('integrity').innerHTML='Replay Integrity: <span class="'+(v.valid?'passText':'failText')+'">'+(v.valid?'PASS':'FAIL')+'</span><br><small>'+v.failure_codes.join(', ')+'</small>';let bad=new Set(v.tampered_events||[]);timeline.innerHTML=d.replay.timeline.map((e,i)=>`<div class="event ${bad.has(e.event_id)?'tampered':e.status}" onclick="inspect(${i})"><b>${icon(e.event_type)} ${e.verb} ${e.event_type}</b> <span class="badge">${e.verification_state}</span><br>${e.actor} → ${e.tool_name||'session'}<br><small>${e.action}</small><div class="hash">${e.event_hash}</div></div>`).join('');graph.innerHTML='<b>Nodes</b>: '+d.replay.lineage_graph.nodes.map(n=>n.id).join(' · ')+'<br><br><b>Edges</b><br>'+d.replay.lineage_graph.edges.map(e=>`<span class=edge>${e.source} --${e.label}--> ${e.target}</span>`).join('<br>');inspector.textContent='Click an event.'}
function inspect(i){inspector.textContent=JSON.stringify(current[i],null,2)}function icon(t){return {judgment:'⚖️',delegation:'🔁',verification:'✅',termination:'⏹️'}[t]||'•'}load('examples/archives/simple_tool_session.jsonl')
</script></body></html>
