<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEP Claude Replay</title><style>body{margin:0;background:#0d1117;color:#e6edf3;font-family:Inter,system-ui}.app{display:grid;grid-template-columns:260px 1fr 430px;grid-template-rows:1fr 330px;height:100vh}aside,main,section{border:1px solid #30363d;padding:16px;overflow:auto}aside{background:#161b22}.graph{grid-column:1/4;background:#0b1220}.event{margin:8px 0;padding:10px;border:1px solid #30363d;border-radius:8px;background:#161b22;cursor:pointer}.event.pass{border-color:#2ea043}.event.fail,.event.tampered{border-color:#f85149;background:#2d1111}button{display:block;width:100%;margin:8px 0;padding:10px;background:#111827;color:#e6edf3;border:1px solid #30363d;border-radius:8px}.passText{color:#3fb950}.failText{color:#f85149}code{display:block;font-size:11px;color:#8b949e;word-break:break-all}pre{white-space:pre-wrap;font-size:12px}.node{display:inline-block;margin:8px;padding:8px;border:1px solid #58a6ff;border-radius:8px}.edge{color:#a5d6ff}</style></head><body><div class="app"><aside><h2>Sessions</h2><button onclick="loadArchive('simple_tool_session')">simple_tool_session</button><button onclick="loadArchive('code_edit_session')">code_edit_session</button><button onclick="loadArchive('claude_code_import')">claude_code_import</button><button onclick="loadArchive('mcp_import')">mcp_import</button><button onclick="loadArchive('tampered_session')">tampered_session</button><h3 id="integrity"></h3></aside><main><h2>Replay Timeline</h2><div id="timeline"></div></main><section><h2>Event Inspector</h2><pre id="inspector">Click an event.</pre></section><section class="graph"><h2>Lineage Graph</h2><div id="graph"></div></section></div><script>let events=[];function icon(t){return {judgment:'⚖️',delegation:'🔁',verification:'✅',termination:'⏹️'}[t]||'•'}async function loadArchive(name){const d=await fetch('/api/archive?path=examples/archives/'+name+'.jsonl').then(r=>r.json());events=d.events;const bad=new Set(d.verification.tampered_events||[]);integrity.innerHTML='Replay Integrity: <span class="'+(d.verification.valid?'passText':'failText')+'">'+(d.verification.valid?'PASS':'FAIL')+'</span><br><small>'+d.verification.failure_codes.join(', ')+'</small>';timeline.innerHTML=d.replay.timeline.map((e,i)=>'<div class="event '+(bad.has(e.event_id)?'tampered':e.status)+'" onclick="inspect('+i+')"><b>'+icon(e.event_type)+' '+e.verb+' '+e.event_type+'</b><p>'+e.actor+' → '+(e.tool_name||'session')+'</p><small>'+e.action+'</small><code>'+e.event_hash+'</code></div>').join('');graph.innerHTML='<b>Nodes</b><br>'+d.replay.lineage_graph.nodes.map(n=>'<span class=node>'+n.id+'<br><small>'+n.type+'</small></span>').join('')+'<br><b>Edges</b><br>'+d.replay.lineage_graph.edges.map(e=>'<div class=edge>'+e.source+' --'+e.label+'--> '+e.target+'</div>').join('')}function inspect(i){inspector.textContent=JSON.stringify(events[i],null,2)}loadArchive('simple_tool_session')</script></body></html>
